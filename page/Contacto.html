                                <tr>
                                    <td>
                                         <label>Nombres:</label><br>
                                         <input type="text" id="txtnombres" placeholder="Ingresa tu nombre" size="50">

                                    <td>

                                </tr>

                                </tr>

                                <tr>
                                    <td>
                                         <label>Género:</label><br>
                                         <input type="radio" name="Género" value="Masculino" checked> Masculino

                                    </td>
                                    <td>

                                    </td>
                                </tr>
